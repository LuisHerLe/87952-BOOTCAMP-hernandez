<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        async function getByUrl(){
            const url = document.getElementById('url').value;
            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('resultText').value = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('resultText').value = 'Error: ' + error.message;
            }
        }

        async function postByUrl(){
            const url = document.getElementById('url').value;
            const nombreValor = document.getElementById('nombreInput').value;

            // El POST solo pide "nombre"
            const payload = {
                nombre: nombreValor
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                document.getElementById('resultText').value = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('resultText').value = 'Error: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <input type="text" id="url" placeholder="url">
    <br><br>
    <input type="text" id="nombreInput" placeholder="nombre">
    <br><br>
    <button id="btnGet" onclick="getByUrl()">GET</button>
    <button id="btnPost" onclick="postByUrl()">POST</button>
    
    <div id="result">
        Resultado
        <div>
            <textarea id="resultText" rows="10" cols="30"> </textarea>
        </div>
    </div>
</body>
</html>
